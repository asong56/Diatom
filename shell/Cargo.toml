# shell/Cargo.toml
#
# Workspace for Diatom's local-crate libraries consumed by src-tauri:
# diatom_bridge (local-SLM chat client) and diatom_agent (browser automation
# agent — planner/executor/tools). Neither produces a binary; both are
# libraries linked into the main Tauri app.
#
# Previously also hosted diatom_devtools/diatom_ui (the GPUI-based DevPanel
# sidecar and its renderer facade), which depended on a stripped Zed source
# tree (`gpui` etc.) that was never vendored into this repository. Removed —
# see DEAD_CODE.md.

[workspace]
resolver = "2"

members = [
    "crates/diatom_bridge",
    "crates/diatom_agent",
]

[workspace.dependencies]
# Unified versions to avoid duplicate compilation
diatom_bridge     = { path = "crates/diatom_bridge" }

anyhow            = "1"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
tokio             = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "macros", "net"] }
futures           = "0.3"
smol              = "2"
log               = "0.4"
parking_lot       = "0.12"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = "symbols"
panic         = "abort"

[profile.dev]
opt-level = 1
