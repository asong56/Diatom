[package]
name        = "diatom_bridge"
version     = "0.3.0"
edition     = "2024"
description = "Local-SLM chat client used by diatom_agent (OpenAI-compatible streaming API at 127.0.0.1:11435)"
license     = "BlueOak-1.0.0"

[dependencies]
anyhow       = "1"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
futures      = "0.3"
async-stream = "0.3.6"
reqwest      = { version = "0.13.3", features = ["json", "stream"] }
